seed: 42
runtime:
  device: cuda
  ddp:
    backend: nccl
    find_unused_parameters: true
    timeout_s: 3600

output:
  root_dir: outputs/huanggua_office_0729_qpos_joint_tactile_history8
  run_name: huanggua_office_unet

data:
  root_dir: /mnt/workspace/lyc/data/huanggua_office/huanggua_office_0729_2248
  window_size: 8
  stride: 1
  n_image_steps: 1
  action_horizon: 128
  # Internal canonical name for 14-D dual-arm QPOS.
  action_type: joint
  action_representation: relative
  use_tactile: true
  # Eight raw deformation frames are the tactile observation condition.
  tactile_obs_steps: 8
  tactile_target_offset: 1
  tactile_latent_cache_path: /mnt/workspace/lyc/data/huanggua_office/huanggua_office_0729_2248/tactile_latent_4x16.zarr
  tactile_deformation_cache_path: /mnt/workspace/lyc/data/huanggua_office/huanggua_office_0729_2248/tactile_deformation_f32.npy
  mix_base_remove_hand: true
  camera_views: [base_0, left_wrist_0, right_wrist_0]
  image_size: 224
  image_as_uint8: true
  use_camera_latent: true
  latent_cache_root_dir: ${data.root_dir}/latent_cache/{auto}
  camera_key: camera
  tactile_key: tactile
  state_key: state_30hz
  action_key: action_30hz
  norm:
    output_range: [-1, 1]
    max_windows: 100000
    batch_windows: 1024
  memory:
    enabled: false
    history_frames: 64
    sample_stride: 4
    recent_frame: 4

models:
  fm:
    cond_dim: 256
    n_image_views: 3
    image_encoder_name: dinov2_small
    dino_model_name: vit_small_patch14_dinov2.lvd142m
    freeze_image_encoder: true
    image_pretrained: true
    image_feat_dim: 256
    view_pool: global_concat
    local_pool_size: 2
    local_attn_heads: 4
    local_attn_dropout: 0.1
    use_tactile: true
    # false = global_cond only; true = Stage 2 joint action+tactile prediction
    predict_tactile: true
    tactile_ae_checkpoint: /mnt/workspace/lyc/flow_matching/outputs/huanggua_office_0729_tactile_ae/tactile_residual_4x16/checkpoints/best.pt
    # Input conditioning is the original 8-frame TemporalCNN. The frozen AE is
    # used only for the 64-D future tactile target/decoder.
    tactile_encoder_type: temporal_cnn
    tactile_condition_encoder_type: temporal_cnn
    tactile_feat_dim: 256
    tactile_temporal_pool: conv1d
    tactile_num_sensors: 4
    tactile_channels_per_sensor: 3
    tactile_token_dim: 16
    action_loss_weight: 1.0
    tactile_loss_weight: 1.0
    state_feat_dim: 256
    state_pool: flatten
    diffusion_step_embed_dim: 256
    velocity_model: unet
    down_dims: [256, 512, 1024]
    kernel_size: 5
    n_groups: 8
    dit_hidden_dim: 512
    dit_depth: 14
    dit_num_heads: 8
    dit_mlp_ratio: 4.0
    dit_dropout: 0.1
    num_inference_steps: 32
    solver: euler
  memory:
    method: fusion
    injection: concat_global_cond
    dim: 256
    num_queries: 3
    visual_heads: 4
    state_hidden_dim: 64
    state_layers: 2
    state_heads: 4
    dropout: 0.1
    cross_attn_layers: [3, 7, 11]
    visual_layers: 2
    state_channels: 128
    state_mem_dim: 64

train:
  batch_size: 256
  num_workers: 32
  drop_last: true
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  epochs: 256
  grad_clip: 1.0
  use_amp: true
  amp_dtype: bf16
  open_loop_test_every: 10
  open_loop_test_max_batches: 16
  plot_samples: 64
  plot_dims: auto
  max_train_batches: null
  resume_path: null
  optimizer:
    lr: 3.0e-4
    min_lr: 1.0e-6
    weight_decay: 1.0e-4

checkpoint:
  save_every: 20

precompute:
  batch_size: 2048
  device: cuda
  overwrite: false
  output_path: null
  token_mode: cls

deploy:
  action_process: abs_qpos
  action_hz: 30.0
