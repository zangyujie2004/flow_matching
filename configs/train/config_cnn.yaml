seed: 42
runtime:
  device: cuda
  ddp:
    backend: nccl
    find_unused_parameters: true
    timeout_s: 3600

output:
  root_dir: outputs/huanggua_office_0802_qpos_cnn
  run_name: huanggua_office_unet

data:
  root_dir: /mnt/workspace/lyc/data/huanggua_office/huanggua_office_0802_1849

  # window
  window_size: 8
  stride: 1
  n_image_steps: 1
  action_horizon: 128
  # robot
  action_type: joint
  action_representation: relative
  # tatile
  use_tactile: true
  # camera
  mix_base_remove_hand: true
  camera_views: ['base_0', 'left_wrist_0', 'right_wrist_0']
  image_size: 224
  image_as_uint8: true
  use_camera_latent: true
  latent_cache_root_dir: ${data.root_dir}/latent_cache/{auto}
  # keys
  camera_key: camera
  tactile_key: tactile
  state_key: state_30hz
  action_key: action_30hz
  # norm
  norm:
    output_range: [-1, 1]
    max_windows: 100000
    batch_windows: 1024
  # memory
  memory:
    enabled: false
    history_frames: 64
    sample_stride: 4
    recent_frame: 4   # n=t-n

models:
  fm:
    cond_dim: 256
    # vision — DINOv2 (timm)
    n_image_views: 3
    image_encoder_name: dinov2_small
    dino_model_name: vit_small_patch14_dinov2.lvd142m  # vit_small_patch14_dinov2.lvd142m
    freeze_image_encoder: true
    image_pretrained: true
    image_feat_dim: 256
    view_pool: global_concat  # global_concat | local_pool | local_attn
    local_pool_size: 2
    local_attn_heads: 4
    local_attn_dropout: 0.1
    # tactile: 4 sensors x 16-D tokens from the latest frame -> 64-D
    use_tactile: true
    # false: tactile is global_cond only; true: jointly predict action+tactile latent
    predict_tactile: false
    tactile_encoder_type: residual_token # temporal_cnn
    tactile_num_sensors: 4
    tactile_channels_per_sensor: 3
    tactile_token_dim: 16
    state_feat_dim: 256
    state_pool: flatten           
    diffusion_step_embed_dim: 256
    velocity_model: unet  # unet | dit
    # unet config
    down_dims: [256, 512, 1024]
    kernel_size: 5
    n_groups: 8
    # dit config
    dit_hidden_dim: 512
    dit_depth: 14
    dit_num_heads: 8
    dit_mlp_ratio: 4.0
    dit_dropout: 0.1
    # common config
    num_inference_steps: 32
    solver: euler 
  memory:
    method: fusion # fusion | multi-scale
    injection: concat_global_cond # cross_attn | concat_global_cond
    # multi-scale
    dim: 256
    num_queries: 3
    visual_heads: 4
    state_hidden_dim: 64
    state_layers: 2
    state_heads: 4
    dropout: 0.1
    cross_attn_layers: [3, 7, 11]
    # fusion
    visual_layers: 2
    state_channels: 128
    state_mem_dim: 64

train:
  batch_size: 256 #1024
  num_workers: 32
  drop_last: true
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  epochs: 256
  grad_clip: 1.0
  use_amp: true
  amp_dtype: bf16  # fp16 | bf16; H20/Ampere+ 推荐 bf16
  open_loop_test_every: 10
  open_loop_test_max_batches: 16
  plot_samples: 64
  plot_dims: auto
  max_train_batches: null
  resume_path: /mnt/workspace/lyc/flow_matching/outputs/huanggua_office_0802_qpos_cnn/huanggua_office_unet/checkpoints/latest.pt
  optimizer:
    lr: 3.0e-4
    min_lr: 1.0e-6
    weight_decay: 1.0e-4

checkpoint:
  save_every: 200

precompute:
  batch_size: 2048
  device: cuda
  overwrite: false
  output_path: null
  token_mode: cls  # cls | all

deploy:
  action_process: abs_qpos # abs_qpos
  action_hz: 30.0
